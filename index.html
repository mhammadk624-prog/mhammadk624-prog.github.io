<title>Smart Email Builder</title>

<style>
:root{--bg:#070916;--tx:#eef0ff;--mu:#9aa3cf;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--in:rgba(255,255,255,.07);--a:#8b5cf6;--b:#06b6d4;--c:#f472b6;--paper:#fff;--ptx:#1c1e33}
[data-t=light]{--bg:#f1f0ff;--tx:#1c1e33;--mu:#5e6490;--card:rgba(255,255,255,.72);--bd:rgba(90,80,170,.18);--in:rgba(255,255,255,.95)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans",sans-serif;background:var(--bg);color:var(--tx);padding:18px;overflow-x:hidden}
.blob{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{background:var(--a);top:-120px;left:-100px}.b2{background:var(--b);bottom:-140px;right:-100px;animation-delay:-5s}.b3{background:var(--c);top:40%;left:45%;width:260px;height:260px;opacity:.25;animation-delay:-9s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.w{max-width:1040px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px rgba(139,92,246,.45)}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.tools{display:flex;gap:8px}
.g{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
@media(max-width:800px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sticky{position:sticky;top:14px}
.st{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.st:first-child{margin-top:0}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:.72rem}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);font:inherit;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
select option{color:#111}
textarea{min-height:76px;resize:vertical}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.chips{grid-template-columns:repeat(2,1fr)}}
.chip{padding:10px 4px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);cursor:pointer;font:inherit;font-size:.78rem;transition:.2s}
.chip:hover{transform:translateY(-2px)}
.chip i{display:block;font-style:normal;font-size:1.4rem;margin-bottom:2px}
.chip.on{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.4)}
.seg{display:flex;gap:6px}.seg .chip{flex:1}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--c));box-shadow:0 10px 26px rgba(244,114,182,.35)}
.micbox{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.micbox>div{flex:1}
.mic{width:68px;height:68px;border-radius:50%;border:0;font-size:1.8rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 10px 28px rgba(139,92,246,.5);flex:none}
.mic.on{animation:pl 1.1s infinite;background:linear-gradient(135deg,#ef4444,#f97316)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 26px rgba(239,68,68,0)}}
.ms{font-size:.82rem;color:var(--mu);margin-top:6px;min-height:1.2em}
.paper{background:var(--paper);color:var(--ptx);border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid #e6e8f2;background:#f6f7fd}
.paper input,.paper textarea{background:transparent;border:0;border-radius:0;color:var(--ptx);box-shadow:none}
.paper input{font-weight:700}
.paper textarea{min-height:270px;line-height:1.75;padding:14px 18px}
.acts{display:flex;gap:8px;margin-top:12px}
.ib{padding:10px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);cursor:pointer;font:inherit}
.acts .ib:nth-child(-n+2){flex:1}
</style>
</head>

</main>

async function mic(){

  if(rec){rec.stop();return}
  try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getTracks().forEach(t=>t.stop())}

  heard='';rec=new R();rec.lang=rc[$('sl').value];rec.interimResults=true;rec.continuous=true;
  $('mic').classList.add('on');$('ms').textContent='🔴 …';
  rec.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;heard=t.trim();$('ms').textContent=heard};
  rec.onerror=e=>{$('ms').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'⚠️ Mic blocked. Open this file in Chrome and click Allow.':'⚠️ '+e.error};

async function tx(t,a,b){
  const parts=t.split(/(?<=[.!?।۔。！？])\s*/).filter(Boolean),ch=[];let c='';
  parts.forEach(p=>{if((c+p).length>400&&c){ch.push(c);c=p}else c+=(c?' ':'')+p});
  if(c)ch.push(c);
  const res=await Promise.all(ch.map(async q=>{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+a+'|'+b);
    const j=await r.json();if(j.responseStatus!=200)throw 0;return j.responseData.translatedText}));
  return res.join(' ');
}
function det(t){
  if(/[\u0900-\u097F]/.test(t))return'hi';
  if(/[\u3040-\u30FF]/.test(t))return'ja';
  if(/[\uAC00-\uD7AF]/.test(t))return'ko';
  if(/[\u4E00-\u9FFF]/.test(t))return'zh';
  if(/[\u0400-\u04FF]/.test(t))return'ru';
  if(/[\u0600-\u06FF]/.test(t)){const e=$('el').value;return['ur','sd','ar'].includes(e)?e:(/[ٹڈڑںھے]/.test(t)?'ur':/[ڻڙڄڃڱ]/.test(t)?'sd':'ar')}
  if(/[ığşİĞŞ]/.test(t))return'tr';
  return $('el').value==='tr'?'tr':'en';
}
async function trans(){

    const lines=$('out').value.split('\n');
    const o=await Promise.all(lines.map(x=>x.trim()&&x.trim()!==me&&x.trim()!=='[ … ]'?tx(x,tc[a],tc[b]):x));
    const sj=$('sj').value.trim()?await tx($('sj').value,tc[a],tc[b]):'';

function lp(t){
  t=t.replace(/[ \t]+/g,' ').replace(/ +([,.;!?])/g,'$1').replace(/([!?.,])\1+/g,'$1').replace(/([,;])(?=[A-Za-z])/g,'$1 ').replace(/([a-z])\.([A-Z])/g,'$1. $2');
  PH.forEach(([a,b])=>{t=t.replace(a,b)});
  t=t.replace(/\bplease please\b/gi,'please');
  return t.replace(/(^|[.!?]\s+|\n)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}
function pe(t){
  const ls=t.split('\n');
  ls[0]=ls[0].replace(/^(hi|hey|hello)\b[ ,]*([A-Za-z.]+(?: [A-Za-z.]+)?)[,!]?$/i,(m,a,n)=>'Dear '+n.charAt(0).toUpperCase()+n.slice(1)+',');
  const ne=ls.map((x,i)=>x.trim()?i:-1).filter(i=>i>=0);
  if(ne.length>=3&&/^(thanks|thank you|thank you very much|bye|best|cheers|regards|best regards)[,.!]*$/i.test(ls[ne[ne.length-2]].trim()))ls[ne[ne.length-2]]='Kind regards,';
  if(ne.length>=3){const n=ne[ne.length-1],w=ls[n].trim().split(/\s+/);
    if(ls[ne[ne.length-2]].trim().endsWith(',')&&w.length<=3&&/^[\p{L} .'-]+$/u.test(ls[n].trim()))ls[n]=w.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');}
  return ls.map(x=>(x.trim().split(/\s+/).length>4&&!/[.!?:,]$/.test(x.trim()))?x.trimEnd()+'.':x).join('\n');

async function lt(t){
  const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'language=en-US&text='+encodeURIComponent(t)});
  const j=await r.json(),names=($('to').value+' '+$('me').value).toLowerCase();
  let out=t,lim=Infinity;
  j.matches.sort((a,b)=>b.offset-a.offset).forEach(m=>{
    const rep=m.replacements[0];if(!rep||m.offset+m.length>lim)return;
    const w=t.substr(m.offset,m.length);
    if(m.rule.issueType==='misspelling'&&(/^[A-Z]/.test(w)||names.includes(w.toLowerCase())))return;
    out=out.slice(0,m.offset)+rep.value+out.slice(m.offset+m.length);lim=m.offset;
  });
  return out;
}
async function polish(){
